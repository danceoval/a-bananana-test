            # TODO: Add " Bananas!" to the end of text.
            # TODO: Return the new string (do not print it here).
            pass


        # Main program
        user_text = input("Enter some text: ")

        # TODO: Call add_bananas with user_text and store the result.

        # TODO: Print the result.

reference_solution:
  language: Python 3
  file_name: assignment.py
  code: |
    def add_bananas(text):
        return text + " Bananas!"


    user_text = input("Enter some text: ")
    result = add_bananas(user_text)
    print(result)

test_cases:
  - name: "Success: simple phrase"
    input: I like
    expected_output: I like Bananas!
    visibility: Sample
    points: 10
  - name: "Success: single word"
    input: Go
    expected_output: Go Bananas!
    visibility: Sample
    points: 10
  - name: "Edge: empty string"
    input: ""
    expected_output: " Bananas!"
    visibility: Hidden
    points: 20
  - name: "Edge: text already contains Bananas"
    input: Bananas
    expected_output: Bananas Bananas!
    visibility: Hidden
    points: 20
  - name: "Edge: text with punctuation"
    input: Hello, world!
    expected_output: Hello, world! Bananas!
    visibility: Hidden
    points: 20
  - name: "Failure: text ending with a space is kept as is"
    input: "Yellow "
    expected_output: Yellow  Bananas!
    visibility: Hidden
    points: 20

feedback:
  pass_message: |
    Great job! Your function adds the bananas correctly every time, even for tricky inputs.
  fail_message: |
    Some test cases did not pass. Compare your output with the examples and check the spacing and the exclamation mark.
  additional_feedback: |
    - Make sure the text you append starts with a space: " Bananas!"
    - Use return inside add_bananas. Print only in the main part of the program.
    - Do not use strip() or change the user's text. Just add to the end of it.
    - If your output looks right but fails, check the capital B and the exclamation mark.

